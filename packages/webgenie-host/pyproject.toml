[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webgenie-host"
version = "1.0.0"
description = "WebGenie native messaging host — AI browser automation BRAIN"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "responses>=0.25",
]

[project.scripts]
webgenie-host = "host:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["."]
